name: CodeQL

on:
  # Run only to validate pull requests targeting the default branches,
  # plus manual dispatch. (No push/schedule triggers — conserves Actions minutes.)
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL · java-kotlin
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          # 'security-and-quality' adds maintainability rules on top of security
          queries: security-and-quality

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Android projects can't use CodeQL autobuild reliably — build explicitly.
      - name: Build (for analysis)
        run: ./gradlew assembleDebug --stacktrace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
