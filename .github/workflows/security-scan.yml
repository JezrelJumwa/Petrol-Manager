name: Security Scan

on:
  # Run only to validate pull requests targeting the default branches,
  # plus manual dispatch. (No push trigger — conserves Actions minutes.)
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # MobSF static source SAST (mobsfscan) — fast, runs on source, uploads SARIF
  # to the GitHub Security tab.
  # ---------------------------------------------------------------------------
  mobsfscan:
    name: MobSF · static source (mobsfscan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install mobsfscan
        run: pip install --upgrade mobsfscan

      - name: Run mobsfscan
        run: mobsfscan --sarif --output mobsfscan.sarif . || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: mobsfscan.sarif
          category: mobsfscan

  # ---------------------------------------------------------------------------
  # Full MobSF static analysis of the built APK via the official Docker image.
  # Findings are saved as a JSON report artifact (security scans are advisory —
  # they don't hard-fail the build; triage happens on the report).
  #
  # NOTE: MobSF *dynamic* analysis (DAST) needs a live Android device/emulator
  # attached to MobSF, which standard GitHub-hosted runners cannot provide
  # (no nested virtualization). DAST is documented as a local/manual step in
  # SECURITY.md and scripts/mobsf-dynamic.md.
  # ---------------------------------------------------------------------------
  mobsf-apk:
    name: MobSF · full APK static scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Start MobSF server
        run: |
          docker run --rm -d --name mobsf -p 8000:8000 \
            opensecurity/mobile-security-framework-mobsf:latest
          echo "Waiting for MobSF to come up..."
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/ >/dev/null 2>&1; then
              echo "MobSF is up"; break
            fi
            sleep 5
          done

      - name: Scan APK with MobSF REST API
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)
          echo "Scanning $APK"
          API_KEY=$(docker logs mobsf 2>&1 | grep -oE 'REST API Key: [a-f0-9]+' | tail -n1 | awk '{print $4}')
          UP=$(curl -fsS -H "Authorization: $API_KEY" -F "file=@${APK}" http://localhost:8000/api/v1/upload)
          HASH=$(echo "$UP" | python3 -c "import sys,json;print(json.load(sys.stdin)['hash'])")
          curl -fsS -H "Authorization: $API_KEY" -X POST --data "hash=${HASH}" http://localhost:8000/api/v1/scan >/dev/null
          curl -fsS -H "Authorization: $API_KEY" -X POST --data "hash=${HASH}" http://localhost:8000/api/v1/report_json -o mobsf-report.json
          echo "Report saved."
        continue-on-error: true

      - name: Upload MobSF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobsf-apk-report
          path: mobsf-report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Secret scanning across the full git history.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Dependency review on PRs — flags known-vulnerable dependency changes.
  # Requires the dependency graph (populated by dependency-submission.yml).
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
