# JVM Arguments - Increased memory and M4 Mac compatibility
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Kotlin Compiler Settings
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.code.style=official

# Android Settings
android.useAndroidX=true
android.enableR8.fullMode=false
android.enableJetifier=false
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.nonFinalResIds=false

# M4 Mac Fix - Disable problematic workers that use jmod/jlink
android.enableJdkWorkers=false
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Disable Gradle Daemon for Android Studio compatibility on M4
# Comment this out if builds are too slow
# org.gradle.daemon=false

# JDK Configuration for M4 Mac
# DO NOT use Android Studio's embedded JBR - it has jlink/jmod issues
# Use system JBR-21 or JDK 17 instead

# Primary option: JBR-21 from system
# org.gradle.java.home=/Users/jezreljumwa/Library/Java/JavaVirtualMachines/jbrsdk_jcef-21.0.9/Contents/Home

# Alternative: Oracle JDK 17 (currently active)
org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home

# Ensure Gradle uses system home, not project directory
# This prevents Android Studio sync issues
